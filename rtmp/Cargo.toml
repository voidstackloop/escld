[package]
name = "rtmp"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
prometheus = "0.14.0"
bytes = "1.12.1"
futures-util = "0.3.33"
anyhow = "1.0.104"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"

# Stream-key lookup — same "Rust services own their own DB read" pattern as
# ws-sfu/src/store/postgres.rs, not an HTTP call to the Java backend.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "uuid", "macros",
] }

# Sends SIGINT to the ffmpeg live-HLS process so it finalizes its last
# segment/playlist on stream end, instead of leaving a truncated one behind
# (SIGKILL would) — same reasoning as ws-sfu/src/sfu/recording.rs.
nix = { version = "0.29", features = ["signal"] }

# /health (matches every other service in this app) + serving the local live
# HLS output directory statically as a same-instance fallback/testing path
# (see http.rs) — real delivery is via S3/CloudFront (see s3_sync.rs).
axum = "0.8"
tower-http = { version = "0.7", features = ["fs", "cors"] }

# Uploads live HLS output (manifest + fMP4 segments) to S3 as it's produced
# (see s3_sync.rs) — same versions/pattern as ws-sfu's identical use for call
# recordings (ws-sfu/Cargo.toml, ws-sfu/src/sfu/recording.rs).
aws-config = "1"
aws-sdk-s3 = "1"

# Publishes the live.ended warehouse event on the crash/disconnect path (see
# warehouse.rs) — the same MSK Serverless cluster/topic the Java backend's
# WarehouseEventPublisher already writes to. `ssl` (TLS under SASL_SSL) +
# `tokio` (FutureProducer's async runtime integration) + `cmake-build`
# (librdkafka's own recommended build method) — NOT `sasl` (Cyrus/GSSAPI,
# irrelevant here: OAUTHBEARER is natively built into librdkafka). MSK IAM
# auth itself is a SigV4-presigned-URL token, generated by
# aws-msk-iam-sasl-signer (a community Rust port of AWS's own Go/Java/Node
# signer libraries) and wired into rdkafka's OAUTHBEARER refresh callback —
# see warehouse.rs's own doc for the exact mechanism. aws-sdk-kafka resolves
# MSK Serverless's bootstrap brokers at connect time (no static endpoint
# exists for Serverless clusters), the same control-plane call the Java
# backend's KafkaConfig makes.
rdkafka = { version = "0.39.0", features = ["tokio", "ssl", "cmake-build"] }
aws-msk-iam-sasl-signer = "1.0.1"
aws-sdk-kafka = "1.124.0"
serde_json = "1.0.151"
chrono = "0.4.45"

# Reads the peak-concurrent-viewer count the Java backend's
# LiveViewerPresenceServiceImpl maintains in Redis (see live_viewers.rs) —
# same shared ElastiCache cluster, a different logical connection/command
# shape, matching this app's established "shared store, per-purpose
# connection" pattern (see the backend's own TrendingConfig).
redis = { version = "1.6.0", features = ["tokio-comp"] }
