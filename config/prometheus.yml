global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-rules.yml

scrape_configs:
  - job_name: escld-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:9090']

  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: elasticsearch
    static_configs:
      - targets: ['elasticsearch-exporter:9114']

  - job_name: ws-sfu
    static_configs:
      - targets: ['ws-sfu:4000']
